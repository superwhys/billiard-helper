basePath: /api
definitions:
  dto.CreateMatchRequest:
    properties:
      game_type:
        type: integer
      max_players:
        type: integer
      target_score:
        type: integer
    type: object
  dto.GameConfig:
    properties:
      game_type:
        description: '比如 1: snooker, 2: 8-ball'
        type: integer
      max_players:
        type: integer
      target_score:
        type: integer
    type: object
  dto.JoinMatchRequest:
    properties:
      match_id:
        type: integer
      nick_name:
        type: string
      player_type:
        $ref: '#/definitions/match.PlayerType'
    type: object
  dto.KickPlayerRequest:
    properties:
      match_id:
        type: integer
      player_code:
        type: string
    type: object
  dto.LoginReq:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  dto.Match:
    properties:
      config:
        $ref: '#/definitions/dto.GameConfig'
      created_at:
        type: string
      id:
        type: integer
      owner_id:
        type: integer
      players:
        items:
          $ref: '#/definitions/dto.Player'
        type: array
      status:
        type: integer
    type: object
  dto.MatchActionRequest:
    properties:
      match_id:
        type: integer
      player_code:
        type: string
    type: object
  dto.Player:
    properties:
      code:
        type: string
      id:
        type: integer
      join_time:
        type: string
      nick_name:
        type: string
      type:
        type: integer
      user_id:
        type: integer
    type: object
  dto.RegisterReq:
    properties:
      code:
        type: string
      email:
        type: string
      name:
        type: string
      password:
        type: string
    type: object
  dto.SendRegisterCodeReq:
    properties:
      email:
        type: string
    type: object
  dto.TokenResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/dto.User'
    type: object
  dto.User:
    properties:
      avatar:
        type: string
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      updated_at:
        type: string
    type: object
  ginutils.Ret-any:
    properties:
      code:
        type: integer
      data: {}
      message: {}
    type: object
  ginutils.Ret-dto_Match:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/dto.Match'
      message: {}
    type: object
  ginutils.Ret-dto_TokenResponse:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/dto.TokenResponse'
      message: {}
    type: object
  match.PlayerType:
    enum:
    - 1
    - 2
    format: int32
    type: integer
    x-enum-varnames:
    - PlayerTypeVirtual
    - PlayerTypeReal
info:
  contact: {}
  description: BilliardHelper
  title: Billiard Helper API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: 登录
      parameters:
      - description: 登录请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-dto_TokenResponse'
      summary: 登录
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: 注册
      parameters:
      - description: 注册请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-any'
      summary: 注册
      tags:
      - Auth
  /auth/send-email-code:
    post:
      consumes:
      - application/json
      description: 发送邮箱验证码
      parameters:
      - description: 发送邮箱验证码请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.SendRegisterCodeReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-any'
      summary: 发送邮箱验证码
      tags:
      - Auth
  /match/create:
    post:
      consumes:
      - application/json
      description: 创建房间
      parameters:
      - description: 创建比赛请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateMatchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-dto_Match'
      summary: 创建房间
      tags:
      - Match
  /match/end:
    post:
      consumes:
      - application/json
      description: 结束比赛
      parameters:
      - description: 结束比赛请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.MatchActionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-any'
      summary: 结束比赛
      tags:
      - Match
  /match/join:
    post:
      consumes:
      - application/json
      description: 加入房间
      parameters:
      - description: 加入房间请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.JoinMatchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-dto_Match'
      summary: 加入房间
      tags:
      - Match
  /match/kick:
    post:
      consumes:
      - application/json
      description: 踢出玩家
      parameters:
      - description: 踢出玩家请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.KickPlayerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-any'
      summary: 踢出玩家
      tags:
      - Match
  /match/leave:
    post:
      consumes:
      - application/json
      description: 离开房间
      parameters:
      - description: 离开房间请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.MatchActionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-any'
      summary: 离开房间
      tags:
      - Match
  /match/start:
    post:
      consumes:
      - application/json
      description: 开始比赛
      parameters:
      - description: 开始比赛请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.MatchActionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-any'
      summary: 开始比赛
      tags:
      - Match
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
