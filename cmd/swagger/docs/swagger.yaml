basePath: /api
definitions:
  dto.AdminMatchStats:
    properties:
      by_type:
        additionalProperties:
          format: int64
          type: integer
        type: object
      date:
        type: string
      timezone:
        type: string
      total:
        type: integer
    type: object
  dto.AdminUser:
    properties:
      avatar:
        type: string
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      is_blocked:
        type: boolean
      is_super_admin:
        type: boolean
      name:
        type: string
      open_id:
        type: string
      phone:
        type: string
    type: object
  dto.AdminUsersResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/dto.AdminUser'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  dto.AppState:
    properties:
      is_super_admin:
        type: boolean
    type: object
  dto.BlockUserRequest:
    properties:
      user_id:
        type: integer
    type: object
  dto.BlockUserResponse:
    properties:
      disconnect_notified:
        type: boolean
      is_blocked:
        type: boolean
    type: object
  dto.CreateMatchRequest:
    properties:
      match_type:
        $ref: '#/definitions/match.MatchType'
      max_players:
        type: integer
      name:
        type: string
      target_score:
        type: integer
      virtual_players:
        items:
          $ref: '#/definitions/dto.Player'
        type: array
    type: object
  dto.DeleteMatchRequest:
    properties:
      match_id:
        type: integer
    type: object
  dto.FeedbackReportReq:
    properties:
      content:
        type: string
    type: object
  dto.JoinMatchRequest:
    properties:
      match_id:
        type: integer
      nick_name:
        type: string
      player_type:
        $ref: '#/definitions/match.PlayerType'
      user_id:
        description: 如果这个玩家是一个真实用户，这个就是真实用户的用户 id
        type: integer
    type: object
  dto.LoginReq:
    properties:
      account:
        type: string
      code_id:
        type: string
      password:
        type: string
      verify_code:
        type: string
    type: object
  dto.Match:
    properties:
      config:
        $ref: '#/definitions/dto.MatchConfig'
      created_at:
        type: string
      current_scores: {}
      id:
        type: integer
      match_games:
        items:
          $ref: '#/definitions/dto.MatchGame'
        type: array
      match_round:
        type: integer
      match_type:
        $ref: '#/definitions/match.MatchType'
      name:
        type: string
      owner_id:
        type: integer
      players:
        items:
          $ref: '#/definitions/dto.Player'
        type: array
      status:
        type: integer
      winner_id:
        type: integer
      winner_score:
        type: integer
    type: object
  dto.MatchActionRequest:
    properties:
      match_id:
        type: integer
      player_code:
        type: string
    type: object
  dto.MatchConfig:
    properties:
      data:
        additionalProperties: {}
        type: object
      max_players:
        type: integer
      target_score:
        type: integer
    type: object
  dto.MatchDetailRequest:
    properties:
      match_id:
        type: integer
    type: object
  dto.MatchGame:
    properties:
      end_at:
        type: integer
      game_num:
        type: integer
      id:
        type: integer
      last_event_id:
        type: integer
      match_id:
        type: integer
      scores:
        items:
          type: integer
        type: array
      start_at:
        type: integer
      winner_id:
        type: integer
    type: object
  dto.MatchListRequest:
    properties:
      cursor:
        type: integer
      limit:
        type: integer
      match_type:
        $ref: '#/definitions/match.MatchType'
    type: object
  dto.MatchScoreListReq:
    properties:
      match_id:
        type: integer
      round:
        type: integer
    type: object
  dto.MatchScoreSyncEvent:
    properties:
      context: {}
      match_id:
        type: integer
      round:
        type: integer
      score_actions:
        description: |-
          用于记录一次操作的所有分数变化
          比如一次操作中，A 玩家加分，B,C 玩家扣分
          也有可能一次操作只有一个玩家有分数变化，此时 ScoreActions 只有一个元素即可
        items:
          $ref: '#/definitions/event.ScoreAction'
        type: array
    type: object
  dto.MatchScoreUndoReq:
    properties:
      match_id:
        type: integer
      round:
        type: integer
    type: object
  dto.Player:
    properties:
      code:
        type: string
      id:
        type: integer
      join_time:
        type: string
      nick_name:
        type: string
      scores:
        type: integer
      type:
        $ref: '#/definitions/match.PlayerType'
      user_id:
        description: 真实用户的用户 id
        type: integer
    type: object
  dto.RefreshTokenReq:
    properties:
      refresh_token:
        type: string
    type: object
  dto.RegisterReq:
    properties:
      account:
        type: string
      code:
        type: string
      code_id:
        type: string
      name:
        type: string
      password:
        type: string
    type: object
  dto.SendRegisterCodeReq:
    properties:
      account:
        type: string
    type: object
  dto.TokenResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  dto.UpdateMatchRequest:
    properties:
      config_data:
        additionalProperties: {}
        type: object
      match_id:
        type: integer
      name:
        type: string
      target_score:
        type: integer
    type: object
  dto.UpdateSelfInfoReq:
    properties:
      name:
        type: string
    type: object
  dto.User:
    properties:
      avatar:
        type: string
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      updated_at:
        type: string
    type: object
  dto.WechatLoginReq:
    properties:
      code:
        type: string
    type: object
  event.ScoreAction:
    properties:
      player_ids:
        items:
          type: integer
        type: array
      score:
        type: integer
    type: object
  ginutils.Ret-any:
    properties:
      code:
        type: integer
      data: {}
      message: {}
    type: object
  ginutils.Ret-array_dto_Match:
    properties:
      code:
        type: integer
      data:
        items:
          $ref: '#/definitions/dto.Match'
        type: array
      message: {}
    type: object
  ginutils.Ret-array_dto_MatchScoreSyncEvent:
    properties:
      code:
        type: integer
      data:
        items:
          $ref: '#/definitions/dto.MatchScoreSyncEvent'
        type: array
      message: {}
    type: object
  ginutils.Ret-dto_AdminMatchStats:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/dto.AdminMatchStats'
      message: {}
    type: object
  ginutils.Ret-dto_AdminUsersResponse:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/dto.AdminUsersResponse'
      message: {}
    type: object
  ginutils.Ret-dto_AppState:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/dto.AppState'
      message: {}
    type: object
  ginutils.Ret-dto_BlockUserResponse:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/dto.BlockUserResponse'
      message: {}
    type: object
  ginutils.Ret-dto_Match:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/dto.Match'
      message: {}
    type: object
  ginutils.Ret-dto_TokenResponse:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/dto.TokenResponse'
      message: {}
    type: object
  ginutils.Ret-dto_User:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/dto.User'
      message: {}
    type: object
  match.MatchType:
    enum:
    - snooker
    - 8ball
    - 9ball
    type: string
    x-enum-varnames:
    - MatchTypeSnooker
    - MatchType8Ball
    - MatchType9Ball
  match.PlayerType:
    enum:
    - 1
    - 2
    format: int32
    type: integer
    x-enum-varnames:
    - PlayerTypeVirtual
    - PlayerTypeReal
info:
  contact: {}
  description: BilliardHelper
  title: Billiard Helper API
  version: "1.0"
paths:
  /account/login:
    post:
      consumes:
      - application/json
      description: 登录
      parameters:
      - description: 登录请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-dto_TokenResponse'
      summary: 登录
      tags:
      - Account
  /account/logout:
    post:
      consumes:
      - application/json
      description: 登出
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-any'
      security:
      - BearerAuth: []
      summary: 登出
      tags:
      - Account
  /account/me:
    get:
      consumes:
      - application/json
      description: 获取用户信息
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-dto_User'
      security:
      - BearerAuth: []
      summary: 获取用户信息
      tags:
      - Account
  /account/me/update:
    post:
      consumes:
      - application/json
      description: 更新用户信息
      parameters:
      - description: 更新用户信息请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateSelfInfoReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-any'
      security:
      - BearerAuth: []
      summary: 更新用户信息
      tags:
      - Account
  /account/refresh:
    post:
      consumes:
      - application/json
      description: 使用 refresh token 刷新 access token
      parameters:
      - description: 刷新 Token 请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RefreshTokenReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-dto_TokenResponse'
      summary: 刷新 access token
      tags:
      - Account
  /account/register:
    post:
      consumes:
      - application/json
      description: 注册
      parameters:
      - description: 注册请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-any'
      summary: 注册
      tags:
      - Account
  /account/send-email-code:
    post:
      consumes:
      - application/json
      description: 发送邮箱验证码
      parameters:
      - description: 发送邮箱验证码请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.SendRegisterCodeReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-any'
      summary: 发送邮箱验证码
      tags:
      - Account
  /account/wx-login:
    post:
      consumes:
      - application/json
      description: 微信登录
      parameters:
      - description: 微信登录请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.WechatLoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-dto_TokenResponse'
      summary: 微信登录
      tags:
      - Account
  /admin/matches/stats:
    get:
      description: 按北京时间统计今日创建的全部比赛，包含已软删除的比赛
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-dto_AdminMatchStats'
      security:
      - BearerAuth: []
      summary: 超管今日比赛统计
      tags:
      - Admin
  /admin/users:
    get:
      parameters:
      - description: 页码，默认 1
        in: query
        name: page
        type: integer
      - description: 每页条数，默认 20，最大 100
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-dto_AdminUsersResponse'
      security:
      - BearerAuth: []
      summary: 超管用户列表
      tags:
      - Admin
  /admin/users/block:
    post:
      consumes:
      - application/json
      parameters:
      - description: 目标用户
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.BlockUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-dto_BlockUserResponse'
      security:
      - BearerAuth: []
      summary: 超管拉黑用户
      tags:
      - Admin
  /app/state:
    get:
      description: 未登录时返回默认状态，携带 Token 时返回当前用户的权限状态
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-dto_AppState'
      summary: 获取应用状态
      tags:
      - App
  /feedback/report:
    post:
      consumes:
      - application/json
      description: 反馈
      parameters:
      - description: 反馈请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.FeedbackReportReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-any'
      security:
      - BearerAuth: []
      summary: 反馈
      tags:
      - Feedback
  /match/create:
    post:
      consumes:
      - application/json
      description: 创建房间
      parameters:
      - description: 创建比赛请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateMatchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-dto_Match'
      security:
      - BearerAuth: []
      summary: 创建房间
      tags:
      - Match
  /match/delete:
    post:
      consumes:
      - application/json
      description: 删除比赛
      parameters:
      - description: 删除比赛请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.DeleteMatchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-any'
      security:
      - BearerAuth: []
      summary: 删除比赛
      tags:
      - Match
  /match/detail:
    get:
      consumes:
      - application/json
      description: 获取比赛详情
      parameters:
      - description: 获取比赛详情请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.MatchDetailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-dto_Match'
      security:
      - BearerAuth: []
      summary: 获取比赛详情
      tags:
      - Match
  /match/end:
    post:
      consumes:
      - application/json
      description: 结束比赛
      parameters:
      - description: 结束比赛请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.MatchActionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-any'
      security:
      - BearerAuth: []
      summary: 结束比赛
      tags:
      - Match
  /match/join:
    post:
      consumes:
      - application/json
      description: 加入房间
      parameters:
      - description: 加入房间请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.JoinMatchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-dto_Match'
      security:
      - BearerAuth: []
      summary: 加入房间
      tags:
      - Match
  /match/leave:
    post:
      consumes:
      - application/json
      description: 离开房间
      parameters:
      - description: 离开房间请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.MatchActionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-any'
      security:
      - BearerAuth: []
      summary: 离开房间
      tags:
      - Match
  /match/list:
    get:
      consumes:
      - application/json
      description: 获取比赛列表
      parameters:
      - description: 获取比赛列表请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.MatchListRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-array_dto_Match'
      security:
      - BearerAuth: []
      summary: 获取比赛列表
      tags:
      - Match
  /match/round/next:
    post:
      consumes:
      - application/json
      description: 下一轮
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-dto_Match'
      security:
      - BearerAuth: []
      summary: 下一轮
      tags:
      - Match
  /match/start:
    post:
      consumes:
      - application/json
      description: 开始比赛
      parameters:
      - description: 开始比赛请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.MatchActionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-any'
      security:
      - BearerAuth: []
      summary: 开始比赛
      tags:
      - Match
  /match/update:
    post:
      consumes:
      - application/json
      description: 更新比赛
      parameters:
      - description: 更新比赛请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateMatchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-dto_Match'
      security:
      - BearerAuth: []
      summary: 更新比赛
      tags:
      - Match
  /score/list:
    get:
      consumes:
      - application/json
      description: 获取分数历史记录
      parameters:
      - description: 获取分数历史记录请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.MatchScoreListReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-array_dto_MatchScoreSyncEvent'
      security:
      - BearerAuth: []
      summary: 获取分数历史记录
      tags:
      - Score
  /score/sync:
    post:
      consumes:
      - application/json
      description: 同步分数
      parameters:
      - description: 同步分数请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.MatchScoreSyncEvent'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-any'
      security:
      - BearerAuth: []
      summary: 同步分数
      tags:
      - Score
  /score/undo:
    post:
      consumes:
      - application/json
      description: 撤回分数
      parameters:
      - description: 撤回分数请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.MatchScoreUndoReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-any'
      security:
      - BearerAuth: []
      summary: 撤回分数
      tags:
      - Score
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
