basePath: /api
definitions:
  dto.CreateRoomRequest:
    properties:
      game_type:
        type: integer
      max_players:
        type: integer
      target_score:
        type: integer
    type: object
  dto.GameConfig:
    properties:
      game_type:
        description: '比如 1: snooker, 2: 8-ball'
        type: integer
      max_players:
        type: integer
      target_score:
        type: integer
    type: object
  dto.JoinRoomRequest:
    properties:
      nick_name:
        type: string
      room_id:
        type: integer
    type: object
  dto.KickPlayerRequest:
    properties:
      room_id:
        type: integer
      target_user_id:
        type: integer
    type: object
  dto.LoginReq:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  dto.Player:
    properties:
      id:
        type: integer
      is_online:
        type: boolean
      join_time:
        type: string
      nick_name:
        type: string
      type:
        type: integer
      user_id:
        type: integer
    type: object
  dto.RegisterReq:
    properties:
      code:
        type: string
      email:
        type: string
      name:
        type: string
      password:
        type: string
    type: object
  dto.Room:
    properties:
      config:
        $ref: '#/definitions/dto.GameConfig'
      created_at:
        type: string
      id:
        type: integer
      owner_id:
        type: integer
      players:
        items:
          $ref: '#/definitions/dto.Player'
        type: array
      room_code:
        type: string
      status:
        type: integer
    type: object
  dto.RoomActionRequest:
    properties:
      room_id:
        type: integer
    type: object
  dto.SendRegisterCodeReq:
    properties:
      email:
        type: string
    type: object
  dto.TokenResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/dto.User'
    type: object
  dto.User:
    properties:
      avatar:
        type: string
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      updated_at:
        type: string
    type: object
  ginutils.Ret-any:
    properties:
      code:
        type: integer
      data: {}
      message: {}
    type: object
  ginutils.Ret-dto_Room:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/dto.Room'
      message: {}
    type: object
  ginutils.Ret-dto_TokenResponse:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/dto.TokenResponse'
      message: {}
    type: object
info:
  contact: {}
  description: BilliardHelper
  title: Billiard Helper API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: 登录
      parameters:
      - description: 登录请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-dto_TokenResponse'
      summary: 登录
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: 注册
      parameters:
      - description: 注册请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-any'
      summary: 注册
      tags:
      - Auth
  /auth/send-email-code:
    post:
      consumes:
      - application/json
      description: 发送邮箱验证码
      parameters:
      - description: 发送邮箱验证码请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.SendRegisterCodeReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-any'
      summary: 发送邮箱验证码
      tags:
      - Auth
  /room/create:
    post:
      consumes:
      - application/json
      description: 创建房间
      parameters:
      - description: 创建房间请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateRoomRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-dto_Room'
      summary: 创建房间
      tags:
      - Room
  /room/end:
    post:
      consumes:
      - application/json
      description: 结束比赛
      parameters:
      - description: 结束比赛请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RoomActionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-any'
      summary: 结束比赛
      tags:
      - Room
  /room/join:
    post:
      consumes:
      - application/json
      description: 加入房间
      parameters:
      - description: 加入房间请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.JoinRoomRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-dto_Room'
      summary: 加入房间
      tags:
      - Room
  /room/kick:
    post:
      consumes:
      - application/json
      description: 踢出玩家
      parameters:
      - description: 踢出玩家请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.KickPlayerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-any'
      summary: 踢出玩家
      tags:
      - Room
  /room/leave:
    post:
      consumes:
      - application/json
      description: 离开房间
      parameters:
      - description: 离开房间请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RoomActionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-any'
      summary: 离开房间
      tags:
      - Room
  /room/start:
    post:
      consumes:
      - application/json
      description: 开始比赛
      parameters:
      - description: 开始比赛请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RoomActionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginutils.Ret-any'
      summary: 开始比赛
      tags:
      - Room
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
